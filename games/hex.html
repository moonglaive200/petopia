<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AFTERGLOW // HEX FINALE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050714;
        color: #fff;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: absolute;
        top: 22px;
        left: 28px;
        right: 28px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        text-shadow: 0 2px 15px #000;
      }
      small {
        display: block;
        font-size: 11px;
        letter-spacing: 2px;
        color: #9babc9;
      }
      #hud strong {
        font-size: 26px;
        font-variant-numeric: tabular-nums;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #040613ae;
        backdrop-filter: blur(7px);
      }
      .panel {
        max-width: 470px;
        width: 92%;
        padding: 32px;
        text-align: center;
        border: 1px solid #52678d;
        border-radius: 20px;
        background: #10182cdd;
        box-shadow: 0 0 80px #42dfff20;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: 3px;
        color: #8deaff;
      }
      .desc {
        color: #c4d0e5;
        line-height: 1.7;
      }
      .stats {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
        padding: 14px;
        background: #17243a;
        border-radius: 12px;
      }
      .stats b {
        font-size: 23px;
      }
      .help {
        font-size: 13px;
        color: #afbdd2;
        line-height: 1.9;
      }
      button {
        cursor: pointer;
        background: #77e8ff;
        color: #071321;
        border: 0;
        border-radius: 12px;
        font-weight: 900;
        font-size: 16px;
        padding: 13px 25px;
        margin-top: 14px;
      }
      #mute {
        position: absolute;
        bottom: 18px;
        right: 20px;
        background: #15253e;
        color: #fff;
        border: 1px solid #526b8f;
        font-size: 12px;
        padding: 10px 14px;
      }
      #touch {
        position: absolute;
        bottom: 25px;
        left: 20px;
        right: 20px;
        display: none;
        justify-content: space-between;
        pointer-events: none;
      }
      #touch button {
        pointer-events: auto;
        opacity: 0.8;
        font-size: 24px;
        min-width: 76px;
      }
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      @media (pointer: coarse) {
        #touch {
          display: flex;
        }
        #mute {
          bottom: 105px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="flash"></div>
    <div id="hud">
      <div>
        <small>TIME / BEST · OVERDRIVE</small
        ><strong id="clock">0.00 / 0.00</strong>
      </div>
      <div style="text-align: right">
        <small>THIS RUN</small><strong id="gold">0 G</strong>
      </div>
    </div>
    <div id="touch">
      <button id="left">◀</button><button id="right">▶</button>
    </div>
    <button id="mute">♫ ON</button>
    <div id="overlay">
      <div class="panel">
        <h1 id="title">AFTERGLOW HEX FINALE</h1>
        <div id="message" class="desc">
          돌아오는 헥사곤!<br />속도 단계 알림 · 삼각/사각 모자이크 · 역회전
          배경!
        </div>
        <div class="stats">
          <div><small>BEST</small><b id="best">0.00초</b></div>
          <div><small>THIS RUN</small><b id="balance">0 G</b></div>
        </div>
        <div class="help">
          A / D 또는 ← / → 회전 · P 일시정지<br />추가 기력 0 · 참가비 15 G
          (입장 시 지불됨)<br />30초 생존 다이아 1 · 120초 생존 다이아 3
        </div>
        <button id="start">START GAME</button>
      </div>
    </div>
    <audio id="music" preload="auto" src="../assets/afterglow.mp3"></audio>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id),
          canvas = $("game"),
          ctx = canvas.getContext("2d"),
          music = $("music");
        const TAU = Math.PI * 2,
          S = TAU / 6,
          DURATION = 160.752,
          STAGES = [0, 22, 48, 65, 95, 125];
        const get = (k, d) => {
            try {
              return JSON.parse(localStorage.getItem(k)) ?? d;
            } catch {
              return d;
            }
          },
          put = (k, v) => {
            try {
              localStorage.setItem(k, JSON.stringify(v));
            } catch {}
          };
        let W,
          H,
          dpr,
          sc,
          mode = "menu",
          time = 0,
          best = get("afterglow_hex_best", 0),
          gold = 0,
          clears = get("afterglow_hex_clears", 0),
          player = -Math.PI / 2,
          spin = 0,
          tileSpin = 0,
          stage = 0,
          spawnAt = 0,
          patternIndex = 0,
          patternName = "",
          lastSafe = 4,
          queue = [],
          walls = [],
          sparks = [],
          last = 0,
          shake = 0,
          glow = 0,
          flash = 0,
          stageBanner = 0,
          stageTitle = "",
          tileMode = 0,
          tileUntil = 0,
          nearGlow = 0,
          muted = false,
          heartUntil = 0,
          combo = 0,
          patternRot = 0,
          finale = false,
          heartTwo = false,
          visualBeat = 0,
          phaseShift = 0;
        const keys = { left: false, right: false },
          mod = (x, n) => ((x % n) + n) % n,
          money = (n) => Math.floor(n).toLocaleString("ko-KR");
        function resize() {
          W = innerWidth;
          H = innerHeight;
          dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          sc = Math.min(W, H) / 700;
        }
        addEventListener("resize", resize);
        resize();
        function hud() {
          $("clock").textContent = time.toFixed(2) + " / " + best.toFixed(2);
          $("gold").textContent = money(gold) + " G";
          $("best").textContent = best.toFixed(2) + "초";
          $("balance").textContent = money(gold) + " G";
        }
        function overlay(title, msg, button) {
          $("title").textContent = title;
          $("message").innerHTML = msg;
          $("start").textContent = button;
          $("overlay").style.display = "flex";
          hud();
        }
        function start() {
          mode = "playing";
          gold = 0;
          time = 0;
          stage = 0;
          player = -Math.PI / 2;
          spin = tileSpin = 0;
          spawnAt = 1.1;
          patternIndex = 0;
          lastSafe = 4;
          queue = [];
          walls = [];
          sparks = [];
          shake = glow = flash = stageBanner = nearGlow = 0;
          tileMode = 0;
          tileUntil = 0;
          heartUntil = 0;
          combo = 0;
          patternRot = 0;
          finale = false;
          heartTwo = false;
          visualBeat = 0;
          phaseShift = 0;
          keys.left = keys.right = false;
          $("overlay").style.display = "none";
          music.pause();
          music.currentTime = 0;
          music.muted = muted;
          music.play().catch(() => pause(true));
        }
        function pause(fail = false) {
          if (mode !== "playing") return;
          mode = "paused";
          music.pause();
          overlay(
            "PAUSED",
            fail ? "음악 재생을 허용한 후 다시 시작해 줘." : "잠시 멈췄어.",
            "RESUME",
          );
        }
        function resume() {
          mode = "playing";
          $("overlay").style.display = "none";
          music.play().catch(() => pause(true));
        }
        function end(win) {
          if (mode !== "playing") return;
          mode = "ended";
          music.pause();
          if (win) time = DURATION;
          best = Math.max(best, time);
          put("afterglow_hex_best", best);
          flash = 0.4;
          shake = 12;
          const reward = 10 + Math.floor(time / 5),
            diamonds = time >= 120 ? 3 : time >= 30 ? 1 : 0;
          gold = reward;
          overlay(
            win ? "TRACK CLEARED!" : "GAME OVER",
            `생존 <b>${time.toFixed(2)}초</b><br>+${reward} G · 다이아 +${diamonds}<br>보상은 Petopia에 자동 저장돼.`,
            "방앗간으로",
          );
          parent.postMessage(
            {
              type: "petopia-hex-result",
              token: new URLSearchParams(location.search).get("session"),
              time,
              win,
            },
            location.origin === "null" ? "*" : location.origin,
          );
        }
        const patterns = [
          {
            name: "OPEN GATE",
            min: 0,
            steps: [0, 0, 1, 1, 0],
            gaps: [3, 3, 3, 2, 3],
            interval: 0.92,
          },
          {
            name: "SPIRAL STEPS",
            min: 0,
            steps: [0, 1, 1, 1, 1, 1],
            gaps: [2, 2, 2, 2, 2, 2],
            interval: 0.79,
          },
          {
            name: "ZIGZAG",
            min: 0,
            steps: [0, 1, -1, 1, -1, 1],
            gaps: [3, 2, 2, 2, 2, 2],
            interval: 0.79,
          },
          {
            name: "REVERSE STEPS",
            min: 1,
            steps: [0, 1, 1, 1, -1, -1, -1],
            gaps: [2, 2, 2, 2, 2, 2, 2],
            interval: 0.72,
          },
          {
            name: "DOUBLE RUSH",
            min: 1,
            steps: [0, 1, 0, -1, 0, 1, 0],
            gaps: [2, 2, 2, 2, 2, 2, 2],
            times: [0, 0.4, 1.4, 1.8, 2.85, 3.25, 4.2],
          },
          {
            name: "HEARTBEAT RUSH",
            min: 2,
            steps: [0, 1, 0, -1, 0, 1, 0, -1],
            gaps: [2, 2, 2, 2, 2, 2, 2, 2],
            times: [0, 0.43, 1.23, 1.66, 2.46, 2.89, 3.69, 4.12],
          },
          {
            name: "RUSH LADDER",
            min: 3,
            steps: [0, 1, 1, 1, -1, -1, -1],
            gaps: [2, 2, 2, 2, 2, 2, 2],
            interval: 0.39,
          },
          {
            name: "TUNNEL SQUEEZE",
            min: 3,
            steps: [0, 0, 1, 0, 1, 0],
            gaps: [3, 3, 2, 2, 2, 1],
            interval: 0.69,
          },
          {
            name: "SPLIT FLASH",
            min: 3,
            steps: [0, 1, 1, -1, 0, 1],
            gaps: [2, 2, 2, 2, 2, 2],
            interval: 0.53,
            split: true,
            blink: true,
          },
          {
            name: "CROSS GATE",
            min: 4,
            steps: [0, 2, -2, 2, -2],
            gaps: [3, 2, 2, 2, 2],
            interval: 1.08,
          },
          {
            name: "CLOCKWISE SPIRAL",
            min: 4,
            steps: [0, 1, 1, 1, 1, 1],
            gaps: [2, 2, 2, 2, 2, 2],
            interval: 0.7,
            rot: 0.12,
          },
          {
            name: "COUNTER SPIRAL",
            min: 4,
            steps: [0, -1, -1, -1, -1, -1],
            gaps: [2, 2, 2, 2, 2, 2],
            interval: 0.7,
            rot: -0.12,
          },
          {
            name: "DOUBLE SPIRAL",
            min: 5,
            steps: [0, 1, 1, -1, -1, 1, 1, -1],
            gaps: [2, 2, 2, 2, 2, 2, 2, 2],
            interval: 0.61,
            rot: 0.1,
          },
          {
            name: "FINAL COMBO",
            min: 5,
            steps: [0, 1, 0, 1, -1, -1, 0, 1, 1],
            gaps: [2, 2, 2, 2, 2, 2, 2, 2, 2],
            interval: 0.47,
            split: true,
          },
          {
            name: "HALF TURN",
            min: 4,
            steps: [0, 1, 1, 1, 0, 0],
            gaps: [3, 3, 3, 3, 2, 2],
            interval: 0.74,
            rot: 0.08,
          },
          {
            name: "FULL TURN",
            min: 5,
            steps: [0, 1, 1, 1, 1, 1, 1, 0],
            gaps: [3, 3, 3, 3, 3, 3, 3, 2],
            interval: 0.65,
            rot: 0.08,
          },
          {
            name: "REVERSE VORTEX",
            min: 5,
            steps: [0, 1, 1, 1, -1, -1, -1, 0],
            gaps: [3, 3, 3, 3, 3, 3, 3, 2],
            interval: 0.66,
            rot: -0.08,
          },
          {
            name: "STROBE RUN",
            min: 5,
            steps: [0, 1, -1, 1, 1, -1, 0],
            gaps: [2, 2, 2, 2, 2, 2, 2],
            interval: 0.47,
            blink: true,
            split: true,
          },
        ];
        function choosePattern() {
          let pool = patterns.filter((p) => p.min <= stage);
          if (time >= 130 && time < 138) {
            pool = pool.filter((p) =>
              [
                "FULL TURN",
                "HALF TURN",
                "REVERSE VORTEX",
                "STROBE RUN",
                "RUSH LADDER",
              ].includes(p.name),
            );
            return pool[Math.floor(Math.random() * pool.length)];
          }
          if (time >= 139) {
            pool = pool.filter((p) =>
              [
                "HEARTBEAT RUSH",
                "DOUBLE RUSH",
                "REVERSE VORTEX",
                "FINAL COMBO",
                "FULL TURN",
                "RUSH LADDER",
              ].includes(p.name),
            );
            return pool[Math.floor(Math.random() * pool.length)];
          }
          if (stage >= 3 && Math.random() < 0.63)
            pool = pool.filter((p) => p.min >= 3);
          if (stage === 2 && Math.random() < 0.65)
            pool = pool.filter((p) => p.min === 2);
          return pool[Math.floor(Math.random() * pool.length)];
        }
        function makeQueue() {
          const p = choosePattern(),
            base = mod(lastSafe + Math.floor(Math.random() * 3) - 1, 6),
            direction = Math.random() < 0.5 ? -1 : 1;
          let safe = base,
            events = [],
            t = 0;
          const speed = 250 + stage * 35 + (time >= 130 ? 45 : 0);
          for (let i = 0; i < p.steps.length; i++) {
            if (i) {
              const step = p.steps[i] * direction;
              safe = mod(safe + step, 6);
            }
            let gap = p.gaps[i];
            if (stage < 3) gap = Math.max(2, gap);
            const interval = p.times
              ? i
                ? p.times[i] - p.times[i - 1]
                : 0
              : i
                ? p.interval
                : 0;
            if (i) t += interval;
            // A single slot can be reached from the preceding slot because adjacent wall arrivals are separated.
            const travel = ((interval || 0.8) * 4.5) / S;
            if (i && Math.abs(p.steps[i]) > 1 && travel < 1.8)
              gap = Math.max(gap, 3);
            events.push({
              at: spawnAt + t,
              safe,
              gap,
              rot: (p.rot || 0) * direction,
              split: !!p.split,
              blink: !!p.blink,
              name: p.name,
              speed,
            });
          }
          lastSafe = safe;
          queue = events;
          spawnAt = events[events.length - 1].at + (stage >= 3 ? 0.85 : 1.08);
          patternName = p.name;
          patternIndex++;
          if (p.min >= 3 && Math.random() < 0.42) {
            tileMode = 1 + Math.floor(Math.random() * 2);
            tileUntil = time + 5.5;
          }
        }
        function spawn(e) {
          const mask = Array.from(
            { length: 6 },
            (_, i) =>
              !Array.from({ length: e.gap }, (_, j) =>
                mod(e.safe + j, 6),
              ).includes(i),
          );
          const radius = Math.hypot(W, H) * 0.52 + 120 * sc;
          // Keep rotation visual and collision positions consistent; safe center anchored to a known lane.
          walls.push({
            r: radius,
            w: (17 + stage * 1.5) * sc,
            v: e.speed * sc,
            mask,
            rot: 0,
            rotSpeed: e.rot,
            split: e.split,
            blink: e.blink,
            passed: false,
            hue: mod(178 + patternIndex * 33 + walls.length * 9, 360),
            name: e.name,
          });
        }
        function stageChange(n) {
          stage = n;
          stageTitle =
            n === 2
              ? "HEARTBEAT!"
              : n === 3
                ? "RUSH MODE!"
                : n === 4
                  ? "HYPER SHIFT!"
                  : n === 5
                    ? "FINAL OVERDRIVE!"
                    : "SPEED UP!";
          stageBanner = 2.6;
          glow = 0.78;
          shake = 8;
          flash = 0.12;
          tileMode = n % 2 ? 2 : 1;
          tileUntil = time + 7;
          if (n === 2) heartUntil = 65;
        }
        function burst(angle, r) {
          for (let i = 0; i < 22; i++) {
            const a = Math.random() * TAU,
              v = 85 + Math.random() * 185;
            sparks.push({
              x: Math.cos(angle) * r,
              y: Math.sin(angle) * r,
              vx: Math.cos(a) * v * sc,
              vy: Math.sin(a) * v * sc,
              life: 0.35 + Math.random() * 0.45,
            });
          }
          nearGlow = 0.85;
          combo++;
        }
        function update(dt) {
          shake = Math.max(0, shake - dt * 30);
          glow = Math.max(0, glow - dt * 0.95);
          flash = Math.max(0, flash - dt * 2);
          nearGlow = Math.max(0, nearGlow - dt * 2.5);
          stageBanner = Math.max(0, stageBanner - dt);
          for (const p of sparks) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
          }
          sparks = sparks.filter((p) => p.life > 0);
          if (mode !== "playing") return;
          const clock = music.currentTime || 0;
          time = Math.max(time + dt, clock);
          if (music.ended || time >= DURATION - 0.035) {
            end(true);
            return;
          }
          const newStage = STAGES.reduce((n, t, i) => (time >= t ? i : n), 0);
          if (newStage > stage) stageChange(newStage);
          if (time >= 130 && time < 138) {
            finale = true;
            phaseShift += dt * 11;
            visualBeat = Math.max(visualBeat, 0.65);
          } else finale = false;
          if (time >= 139 && !heartTwo) {
            heartTwo = true;
            stageTitle = "HEARTBEAT II";
            stageBanner = 2.5;
            glow = 0.6;
            shake = 10;
            tileMode = 2;
            tileUntil = time + 9;
          }
          visualBeat = Math.max(0, visualBeat - dt * 1.4);
          const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
          player += dir * 4.7 * dt;
          spin += dt * (0.28 + stage * 0.15);
          tileSpin -= dt * (0.14 + stage * 0.07) * (patternRot >= 0 ? 1 : -1);
          if (time > tileUntil) tileMode = 0;
          if (!queue.length && time >= spawnAt - 0.01) makeQueue();
          while (queue.length && time >= queue[0].at) {
            spawn(queue.shift());
          }
          const hitR = 90 * sc;
          for (const w of walls) {
            const old = w.r;
            w.r -= w.v * dt;
            w.rot += w.rotSpeed * dt;
            if (!w.passed && old - w.w > hitR && w.r - w.w <= hitR) {
              const rel = mod(player - w.rot, TAU),
                slot = Math.floor(rel / S) % 6,
                inside = rel % S,
                margin = 0.09;
              if (
                w.mask[slot] ||
                (inside < margin && w.mask[(slot + 5) % 6]) ||
                (inside > S - margin && w.mask[(slot + 1) % 6])
              ) {
                end(false);
                return;
              } else {
                w.passed = true;
                burst(player, hitR);
              }
            }
          }
          walls = walls.filter((w) => w.r > 12 * sc);
          hud();
        }
        function polygon(r, rot) {
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = rot + i * S;
            i
              ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r)
              : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
          }
          ctx.closePath();
        }
        function draw() {
          const pulse = 0.5 + 0.5 * Math.sin(time * TAU * 2.12),
            heartbeat =
              time >= 48 && time < 65
                ? Math.pow(
                    Math.max(0, Math.sin((time - 48) * Math.PI * 4.24)),
                    8,
                  )
                : time >= 139
                  ? Math.pow(
                      Math.max(0, Math.sin((time - 139) * Math.PI * 5.0)),
                      6,
                    )
                  : 0,
            hue = finale
              ? mod(Math.floor((time - 130) * 7) * 93, 360)
              : mod(194 + time * 8, 360);
          ctx.fillStyle = finale
            ? Math.floor(time * 13) % 2
              ? "#12001d"
              : "#001b2a"
            : "#050713";
          ctx.fillRect(0, 0, W, H);
          const bg = ctx.createRadialGradient(
            W / 2,
            H / 2,
            0,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.8,
          );
          bg.addColorStop(0, `hsla(${hue},78%,${12 + pulse * 4}%,.7)`);
          bg.addColorStop(1, "#03050d");
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);
          ctx.save();
          ctx.translate(
            W / 2 + (Math.random() - 0.5) * shake,
            H / 2 + (Math.random() - 0.5) * shake,
          );
          if (tileMode) {
            ctx.save();
            ctx.rotate(tileSpin + (finale ? Math.sin(time * 3) * 0.6 : 0));
            const unit = Math.max(64, Math.min(W, H) * 0.12),
              span = Math.hypot(W, H) * 1.25;
            ctx.globalAlpha = 0.23;
            for (let yy = -span; yy < span; yy += unit)
              for (let xx = -span; xx < span; xx += unit) {
                const odd = (Math.round(xx / unit) + Math.round(yy / unit)) & 1;
                if (tileMode === 2) {
                  ctx.fillStyle = odd ? "#6840b4" : "#087d9a";
                  ctx.fillRect(xx, yy, unit - 1, unit - 1);
                } else {
                  ctx.beginPath();
                  ctx.moveTo(xx, yy);
                  ctx.lineTo(xx + unit, yy);
                  ctx.lineTo(xx, yy + unit);
                  ctx.fillStyle = odd ? "#5b37a9" : "#0d8b9b";
                  ctx.fill();
                  ctx.beginPath();
                  ctx.moveTo(xx + unit, yy + unit);
                  ctx.lineTo(xx + unit, yy);
                  ctx.lineTo(xx, yy + unit);
                  ctx.fillStyle = odd ? "#0d8b9b" : "#5b37a9";
                  ctx.fill();
                }
              }
            ctx.restore();
          }
          ctx.save();
          ctx.rotate(spin + (finale ? Math.sin(time * 5) * 0.25 : 0));
          for (let j = 13; j >= 1; j--) {
            const r =
              (j * 65 + ((time * 20) % 65)) * sc * (1 + heartbeat * 0.04);
            polygon(r, Math.PI / 6);
            ctx.strokeStyle = `hsla(${mod(hue + j * 11, 360)},95%,67%,${0.045 + 0.065 * pulse})`;
            ctx.lineWidth = 1.4 * sc;
            ctx.stroke();
          }
          ctx.restore();
          for (const w of walls) {
            for (let i = 0; i < 6; i++) {
              if (!w.mask[i]) continue;
              const a = i * S + w.rot,
                b = (i + 1) * S + w.rot,
                parts = w.split ? 3 : 1;
              for (let j = 0; j < parts; j++) {
                const aa = a + ((b - a) * j) / parts + (w.split ? 0.014 : 0),
                  bb = a + ((b - a) * (j + 1)) / parts - (w.split ? 0.014 : 0),
                  r = w.r * (1 + heartbeat * 0.065),
                  inner = (w.r - w.w) * (1 + heartbeat * 0.065);
                ctx.beginPath();
                ctx.moveTo(Math.cos(aa) * r, Math.sin(aa) * r);
                ctx.lineTo(Math.cos(bb) * r, Math.sin(bb) * r);
                ctx.lineTo(Math.cos(bb) * inner, Math.sin(bb) * inner);
                ctx.lineTo(Math.cos(aa) * inner, Math.sin(aa) * inner);
                ctx.closePath();
                const alpha = w.blink
                  ? 0.72 + 0.25 * Math.sin(time * 18 + w.hue) ** 2
                  : 0.94;
                ctx.fillStyle = `hsla(${finale ? mod(hue + ((i + j) % 3) * 100, 360) : w.hue},95%,${64 + 8 * pulse}%,${alpha})`;
                ctx.shadowColor = `hsl(${w.hue},100%,65%)`;
                ctx.shadowBlur = (9 + 9 * pulse + 12 * heartbeat) * sc;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "#dffaff";
                ctx.lineWidth = 1.1 * sc;
                ctx.stroke();
              }
            }
          }
          polygon(61 * sc * (1 + heartbeat * 0.11), spin * 0.4);
          ctx.fillStyle = "#10223e";
          ctx.shadowColor = "#4fe6ff";
          ctx.shadowBlur = 12 * sc;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#70eaff";
          ctx.lineWidth = 5 * sc;
          ctx.stroke();
          drawKitty(0, 0, 2.1 * sc);
          ctx.save();
          ctx.translate(Math.cos(player) * 90 * sc, Math.sin(player) * 90 * sc);
          ctx.rotate(player + Math.PI / 2);
          drawKitty(0, 0, 0.62 * sc);
          ctx.restore();
          for (const p of sparks) {
            ctx.globalAlpha = Math.min(1, p.life * 2);
            ctx.fillStyle = "#a6ffff";
            ctx.fillRect(p.x - 2 * sc, p.y - 2 * sc, 4 * sc, 4 * sc);
          }
          ctx.globalAlpha = 1;
          if (nearGlow) {
            ctx.beginPath();
            ctx.arc(0, 0, (100 + (1 - nearGlow) * 90) * sc, 0, TAU);
            ctx.strokeStyle = `rgba(120,255,255,${nearGlow * 0.5})`;
            ctx.lineWidth = 4 * sc;
            ctx.stroke();
          }
          ctx.restore();
          if (finale) {
            ctx.fillStyle = `hsla(${mod(hue + 180, 360)},100%,65%,${0.045 + 0.085 * Math.pow(Math.sin(time * TAU * 4), 2)})`;
            ctx.fillRect(0, 0, W, H);
          }
          if (heartbeat) {
            ctx.fillStyle = `rgba(128,63,235,${heartbeat * 0.11})`;
            ctx.fillRect(0, 0, W, H);
          }
          if (glow) {
            ctx.fillStyle = `rgba(215,245,255,${glow * glow * 0.65})`;
            ctx.fillRect(0, 0, W, H);
          }
          if (stageBanner > 0) {
            ctx.save();
            ctx.textAlign = "center";
            ctx.shadowColor = "#67eaff";
            ctx.shadowBlur = 18;
            ctx.fillStyle = `rgba(245,253,255,${Math.min(1, stageBanner)})`;
            ctx.font = `900 ${Math.max(27, Math.min(W * 0.055, 56))}px system-ui`;
            ctx.fillText(stageTitle, W / 2, H * 0.29);
            ctx.font = `700 ${Math.max(13, Math.min(W * 0.025, 22))}px system-ui`;
            ctx.fillText(
              "LEVEL " +
                (stage + 1) +
                "  ·  " +
                (stage === 2
                  ? "PULSE"
                  : stage === 3
                    ? "CHAIN WALLS"
                    : stage >= 4
                      ? "PATTERN SHIFT"
                      : "FASTER"),
              W / 2,
              H * 0.29 + 38,
            );
            ctx.restore();
          }
        }
        function drawKitty(x, y, k) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(k, k);
          const r = (x, y, w, h, c) => {
            ctx.fillStyle = c;
            ctx.fillRect(x, y, w, h);
          };
          r(-14, -12, 28, 25, "#efbc78");
          r(-14, -22, 8, 14, "#c68b58");
          r(6, -22, 8, 14, "#c68b58");
          r(-11, -18, 3, 7, "#eda5a2");
          r(9, -18, 3, 7, "#eda5a2");
          r(-8, -3, 4, 4, "#283e41");
          r(5, -3, 4, 4, "#283e41");
          r(-2, 4, 4, 2, "#ba7768");
          r(-8, 9, 16, 7, "#fff1cc");
          r(-19, 3, 8, 1, "#fff5d3");
          r(12, 3, 8, 1, "#fff5d3");
          ctx.restore();
        }
        addEventListener("message", (e) => {
          if (
            e.source !== parent ||
            e.origin !== location.origin ||
            e.data?.type !== "petopia-mute"
          )
            return;
          muted = !!e.data.muted;
          music.muted = muted;
          $("mute").textContent = muted ? "♫ OFF" : "♫ ON";
        });
        function loop(now) {
          const dt = Math.min((now - last) / 1000 || 0, 0.045);
          last = now;
          update(dt);
          draw();
          requestAnimationFrame(loop);
        }
        $("start").onclick = () => {
          if (mode === "ended") {
            parent.postMessage(
              { type: "petopia-hex-exit" },
              location.origin === "null" ? "*" : location.origin,
            );
            return;
          }
          mode === "paused" ? resume() : start();
        };
        $("mute").onclick = () => {
          muted = !muted;
          music.muted = muted;
          $("mute").textContent = muted ? "♫ OFF" : "♫ ON";
        };
        addEventListener("keydown", (e) => {
          if (
            ["ArrowLeft", "ArrowRight", "KeyA", "KeyD", "KeyP"].includes(e.code)
          )
            e.preventDefault();
          if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
          if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
          if (e.code === "KeyP" && !e.repeat) {
            if (mode === "playing") pause();
            else if (mode === "paused") resume();
          }
        });
        addEventListener("keyup", (e) => {
          if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
          if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
        });
        addEventListener("blur", () => {
          keys.left = keys.right = false;
          if (mode === "playing") pause();
        });
        for (const [id, k] of [
          ["left", "left"],
          ["right", "right"],
        ]) {
          const b = $(id);
          b.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            keys[k] = true;
            b.setPointerCapture(e.pointerId);
          });
          for (const event of [
            "pointerup",
            "pointercancel",
            "lostpointercapture",
          ])
            b.addEventListener(event, () => (keys[k] = false));
        }
        hud();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
